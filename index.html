<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mayowa & Co. | Owner Dashboard</title>

  <script src="https://accounts.google.com/gsi/client" async defer></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f7f4;
      color: #222;
    }

    header {
      background: #14532d;
      color: white;
      padding: 24px 16px;
      text-align: center;
    }

    header h1 { margin: 0 0 8px; }

    main {
      max-width: 600px;
      margin: 35px auto;
      padding: 0 16px;
    }

    .card {
      background: white;
      padding: 28px 20px;
      border-radius: 12px;
      box-shadow: 0 3px 14px #0000000d;
      text-align: center;
    }

    .status {
      padding: 12px;
      margin-top: 20px;
      border-radius: 8px;
      background: #fef3c7;
      color: #92400e;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    #googleButton {
      display: flex;
      justify-content: center;
      margin: 24px 0;
    }

    .small {
      font-size: 13px;
      color: #666;
      line-height: 1.6;
    }

    footer {
      text-align: center;
      padding: 20px;
      font-size: 13px;
      color: #666;
    }
  </style>
</head>

<body>
  <header>
    <h1>Mayowa &amp; Co.</h1>
    <div>Property Owner Dashboard</div>
  </header>

  <main>
    <section class="card">
      <h2>Manage Your Properties</h2>
      <p>Sign in with Google to begin accessing your owner dashboard.</p>

      <div id="googleButton"></div>

      <div id="status" class="status" role="status">
        Loading Google sign-in…
      </div>

      <p class="small">
        Your account must be verified before any property information
        can be accessed or changed.
      </p>
    </section>
  </main>

  <footer>
    &copy; <span id="year"></span> Mayowa &amp; Co.
  </footer>

  <script>
    const GOOGLE_CLIENT_ID =
      "205292905246-imt2dkqlitd5iurh0jno456147cvhps1.apps.googleusercontent.com";

    const statusBox = document.getElementById("status");

    document.getElementById("year").textContent =
      new Date().getFullYear();

    function showStatus(message) {
      statusBox.textContent = message;
    }

    function handleGoogleCredential(response) {
      // Do not save or trust the identity from the browser alone.
      // A server must verify this token before granting access.
      showStatus(
        "Google returned a sign-in token. Secure server verification " +
        "and owner authorization must be connected before your properties " +
        "can be displayed or changed."
      );

      // Do not log or store the credential.
    }

    window.addEventListener("load", function () {
      if (!window.google || !google.accounts || !google.accounts.id) {
        showStatus(
          "Google sign-in could not load. Check your internet connection " +
          "and reload this page."
        );
        return;
      }

      google.accounts.id.initialize({
        client_id: GOOGLE_CLIENT_ID,
        callback: handleGoogleCredential
      });

      google.accounts.id.renderButton(
        document.getElementById("googleButton"),
        {
          theme: "outline",
          size: "large",
          shape: "rectangular",
          text: "signin_with",
          width: 260
        }
      );

      showStatus(
        "Google sign-in is ready. Property access remains disabled " +
        "until server-side verification is connected."
      );
    });
  </script>
</body>
</html>
