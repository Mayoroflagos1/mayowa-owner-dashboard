<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Available Properties | Mayowa & Co.</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f5f7f5;
      color: #222;
    }

    header {
      background: #163c32;
      color: white;
      text-align: center;
      padding: 28px 15px;
    }

    header h1 {
      margin: 0 0 10px;
      font-size: 28px;
    }

    header p {
      margin: 0;
    }

    main {
      max-width: 1200px;
      margin: auto;
      padding: 25px 15px;
    }

    #message {
      text-align: center;
      padding: 25px 10px;
      color: #555;
    }

    .properties {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
    }

    .card {
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 3px 12px #00000012;
    }

    .card img {
      display: block;
      width: 100%;
      height: 210px;
      object-fit: cover;
      background: #e5e5e5;
    }

    .details {
      padding: 16px;
    }

    .details h2 {
      color: #163c32;
      font-size: 20px;
      margin: 8px 0;
    }

    .tag {
      display: inline-block;
      background: #e4f1e9;
      color: #163c32;
      padding: 6px 9px;
      border-radius: 5px;
      font-size: 12px;
    }

    .price {
      font-size: 19px;
      font-weight: bold;
      color: #167447;
    }

    .description {
      line-height: 1.5;
      color: #555;
      overflow-wrap: anywhere;
    }

    .contact {
      display: inline-block;
      background: #163c32;
      color: white;
      text-decoration: none;
      padding: 12px 15px;
      border-radius: 5px;
      margin-top: 8px;
    }

    .contact:hover {
      background: #245847;
    }

    footer {
      text-align: center;
      padding: 22px;
      color: #666;
      font-size: 14px;
    }
  </style>
</head>

<body>

  <header>
    <h1>Mayowa &amp; Co.</h1>
    <p>Find Your Perfect Property</p>
  </header>

  <main>
    <h2>Available Properties</h2>
    <p>Explore properties approved by our team.</p>

    <div id="message">Loading available properties...</div>
    <div class="properties" id="properties"></div>
  </main>

  <footer>
    &copy; 2026 Mayowa &amp; Co. All rights reserved.
  </footer>

  <script>
    const SUPABASE_URL =
      "https://pvvsgzaruibqvcskejhc.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_lixabtxRJWc_l4e9bXf01w_iSIDTwVg";

    async function loadProperties() {
      const message = document.getElementById("message");
      const container = document.getElementById("properties");

      try {
        const response = await fetch(
          SUPABASE_URL +
          "/rest/v1/properties?select=id,title,property_type,location,price,description,image_url,listing_purpose,created_at&status=eq.approved&order=created_at.desc",
          {
            headers: {
              "apikey": SUPABASE_KEY,
              "Authorization": "Bearer " + SUPABASE_KEY
            }
          }
        );

        if (!response.ok) {
          throw new Error("Database request failed: " + response.status);
        }

        const properties = await response.json();

        message.textContent = "";

        if (!properties.length) {
          message.textContent =
            "No properties are available at the moment. Please check again soon.";
          return;
        }

        properties.forEach(function(property) {
          const card = document.createElement("article");
          card.className = "card";

          if (property.image_url) {
            const img = document.createElement("img");
            img.src = property.image_url;
            img.alt = property.title || "Property image";
            img.loading = "lazy";

            img.onerror = function() {
              img.style.display = "none";
            };

            card.appendChild(img);
          }

          const details = document.createElement("div");
          details.className = "details";

          const tag = document.createElement("span");
          tag.className = "tag";
          tag.textContent = [
            property.listing_purpose,
            property.property_type
          ].filter(Boolean).join(" | ") || "Property";

          const title = document.createElement("h2");
          title.textContent = property.title || "Property listing";

          const location = document.createElement("p");
          location.textContent =
            "Location: " + (property.location || "Contact us for details");

          const price = document.createElement("p");
          price.className = "price";

          if (property.price !== null && property.price !== undefined) {
            price.textContent =
              "₦" + Number(property.price).toLocaleString("en-NG");
          } else {
            price.textContent = "Price on request";
          }

          const description = document.createElement("p");
          description.className = "description";
          description.textContent = property.description || "";

          const contact = document.createElement("a");
          contact.className = "contact";
          contact.href = "https://wa.me/mayowa.co";
          contact.target = "_blank";
          contact.rel = "noopener noreferrer";
          contact.textContent = "Enquire About This Property";

          details.appendChild(tag);
          details.appendChild(title);
          details.appendChild(location);
          details.appendChild(price);
          details.appendChild(description);
          details.appendChild(contact);

          card.appendChild(details);
          container.appendChild(card);
        });

      } catch (error) {
        console.error(error);
        message.textContent =
          "We couldn't load properties. Please try again later.";
      }
    }

    loadProperties();
  </script>

</body>
</html>
