<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Properties | Mayowa & Co.</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
    }

    h1 {
      text-align: center;
      color: #163c32;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #666;
      margin-bottom: 25px;
    }

    #message {
      text-align: center;
      padding: 20px;
    }

    .properties {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 20px;
      max-width: 1200px;
      margin: auto;
    }

    .card {
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 8px #00000012;
    }

    .card img {
      width: 100%;
      height: 210px;
      object-fit: cover;
      background: #ddd;
    }

    .details {
      padding: 16px;
    }

    .details h2 {
      margin: 0 0 10px;
      font-size: 19px;
      color: #163c32;
    }

    .price {
      color: #167447;
      font-weight: bold;
      font-size: 18px;
    }

    .tag {
      display: inline-block;
      background: #e4f1e9;
      color: #163c32;
      padding: 5px 9px;
      border-radius: 5px;
      font-size: 12px;
      margin-bottom: 10px;
    }

    .description {
      line-height: 1.5;
      color: #555;
    }

    .contact {
      display: inline-block;
      background: #163c32;
      color: white;
      padding: 11px 15px;
      border-radius: 5px;
      text-decoration: none;
      margin-top: 10px;
    }
  </style>
</head>

<body>

  <h1>Available Properties</h1>
  <p class="subtitle">Find your next property with Mayowa & Co.</p>

  <div id="message">Loading properties...</div>
  <div class="properties" id="properties"></div>

  <script>
    const SUPABASE_URL =
      "https://pvvsgzaruibqvcskejhc.supabase.co";

    const SUPABASE_KEY =
      "sb_publishable_lixabtxRJWc_l4e9bXf01w_iSIDTwVg";

    async function loadProperties() {
      const message = document.getElementById("message");
      const container = document.getElementById("properties");

      try {
        const response = await fetch(
          `${SUPABASE_URL}/rest/v1/properties?select=id,title,property_type,location,price,description,image_url,listing_purpose,created_at&status=eq.approved&order=created_at.desc`,
          {
            headers: {
              "apikey": SUPABASE_KEY,
              "Authorization": `Bearer ${SUPABASE_KEY}`
            }
          }
        );

        if (!response.ok) {
          throw new Error("Could not load properties.");
        }

        const properties = await response.json();

        message.textContent = "";

        if (properties.length === 0) {
          message.textContent =
            "No properties are available right now. Please check again soon.";
          return;
        }

        properties.forEach(property => {
          const card = document.createElement("article");
          card.className = "card";

          const image = document.createElement("img");
          image.src = property.image_url || "";
          image.alt = property.title || "Property";
          image.loading = "lazy";

          image.onerror = () => {
            image.style.display = "none";
          };

          const details = document.createElement("div");
          details.className = "details";

          const title = document.createElement("h2");
          title.textContent = property.title || "Property";

          const tag = document.createElement("span");
          tag.className = "tag";
          tag.textContent = [
            property.listing_purpose,
            property.property_type
          ].filter(Boolean).join(" • ") || "Property";

          const location = document.createElement("p");
          location.textContent = "Location: " + (property.location || "Contact us");

          const price = document.createElement("p");
          price.className = "price";
          price.textContent = property.price == null
            ? "Price on request"
            : "₦" + Number(property.price).toLocaleString("en-NG");

          const description = document.createElement("p");
          description.className = "description";
          description.textContent = property.description || "";

          const contact = document.createElement("a");
          contact.className = "contact";
          contact.href = "https://wa.me/mayowa.co";
          contact.target = "_blank";
          contact.rel = "noopener";
          contact.textContent = "Enquire on WhatsApp";

          details.append(
            tag,
            title,
            location,
            price,
            description,
            contact
          );

          card.append(image, details);
          container.appendChild(card);
        });

      } catch (error) {
        message.textContent =
          "We couldn't load the properties. Please try again later.";
        console.error(error);
      }
    }

    loadProperties();
  </script>

</body>
</html>
